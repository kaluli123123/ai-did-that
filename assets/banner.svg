<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AI Did That</title>
  <desc id="desc">An ivory evidence card with dark typography, teal accents, and three rows: outcome, contribution, source.</desc>
  <rect width="1200" height="440" rx="18" fill="#F5F3EA"/>
  <rect x="1" y="1" width="1198" height="438" rx="17" fill="none" stroke="#D5D8CE" stroke-width="2"/>
  <path d="M60 94H1140M60 344H1140" stroke="#CFD3C8" stroke-width="1.5"/>
  <circle cx="70" cy="59" r="8" fill="#137864"/>
  <text x="91" y="65" fill="#245349" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">AN OPEN COLLECTION OF OUTCOMES</text>
  <text x="58" y="201" fill="#172C29" font-family="Georgia, 'Times New Roman', serif" font-size="97" letter-spacing="-4">AI Did That.</text>
  <text x="63" y="264" fill="#415B54" font-family="Arial, Helvetica, sans-serif" font-size="26">Real things AI helped accomplish.</text>
  <text x="63" y="304" fill="#137864" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Sources included.</text>
  <rect x="814" y="125" width="318" height="186" rx="10" fill="#E6EBDF"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#245349">
    <text x="841" y="169" fill="#137864">01</text><text x="884" y="169">The outcome</text>
    <text x="841" y="224" fill="#137864">02</text><text x="884" y="224">The people + AI</text>
    <text x="841" y="279" fill="#137864">03</text><text x="884" y="279">The evidence</text>
  </g>
  <path d="M839 189H1107M839 244H1107" stroke="#CCD5C6"/>
  <text x="63" y="390" fill="#415B54" font-family="Arial, Helvetica, sans-serif" font-size="20">Research breakthroughs. Useful work. Everyday accomplishments.</text>
</svg>
